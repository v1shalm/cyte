name: Pool
options:
  bundleIdPrefix: app.cyte
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    DEVELOPMENT_TEAM: XNTSUNT6QD
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pool:
    type: application
    platform: macOS
    sources:
      - path: Pool
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cyte.mac
        PRODUCT_NAME: Cyte
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: Pool/Resources/Cyte.entitlements
        CYTE_FEED_URL: https://pool-mac.vercel.app/appcast.xml
        CYTE_UPDATE_KEY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cyte
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: Cyte adds new screenshots to your library as you take them.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: Cyte reads the folder you chose for your library.
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: Cyte saves images and videos you drag in from Downloads.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Cyte listens while you speak a note or search by voice.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Cyte turns what you say into text on this Mac.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Cyte reads the address of the page open in your browser so it can save it.
    info:
      path: Pool/Resources/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.cyte.mac.save
            UTTypeDescription: Cyte save
            UTTypeConformsTo: [public.data]
        CFBundleURLTypes:
          - CFBundleURLName: app.cyte.mac
            CFBundleURLSchemes: [cyte, pool]
        SUFeedURL: $(CYTE_FEED_URL)
        SUPublicEDKey: $(CYTE_UPDATE_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
  CyteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CyteTests
    dependencies:
      - target: Pool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cyte.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cyte.app/Contents/MacOS/Cyte"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Pool:
    build:
      targets:
        Pool: all
        CyteTests: [test]
    test:
      targets:
        - CyteTests
    run:
      config: Debug
    archive:
      config: Release
