name: Pool
options:
  bundleIdPrefix: in.tistmedia
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    DEVELOPMENT_TEAM: XNTSUNT6QD
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pool:
    type: application
    platform: macOS
    sources:
      - path: Pool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.tistmedia.pool
        PRODUCT_NAME: Cyte
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cyte
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: Cyte adds new screenshots to your library as you take them.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: Cyte reads the folder you chose for your library.
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: Cyte saves images you drag in from Downloads.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Cyte listens while you speak a note or search by voice.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Cyte turns what you say into text on this Mac.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Cyte reads the address of the page open in your browser so it can save it.
    info:
      path: Pool/Resources/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: in.tistmedia.pool.save
            UTTypeDescription: Cyte save
            UTTypeConformsTo: [public.data]
        CFBundleURLTypes:
          - CFBundleURLName: in.tistmedia.pool
            CFBundleURLSchemes: [pool]
